<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Online</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; color: #222; }
  .card { background: #fff; padding: 18px; border-radius: 12px; max-width: 520px; margin: 0 auto; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 16px; }
  .row { margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=time], input[type=date], select {
    width: 100%; padding: 9px 10px; border: 1px solid #ccd3da; border-radius: 8px; font-size: 14px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid #2f80ed33; border-color: #2f80ed; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .primary { background: #2f80ed; color: #fff; margin-top: 6px; }
  .primary:hover { background: #1f6fd6; }
  .primary:disabled { background: #aaa; cursor: not-allowed; }
  .foto-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btn-foto {
    padding: 12px 8px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 2px dashed #2f80ed; background: #eaf2fe; color: #1f6fd6; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .btn-foto:active { background: #d6e6fd; }
  .btn-foto .ico { font-size: 22px; }
  .preview-box { margin-top: 10px; text-align: center; }
  .preview-box img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid #ddd; }
  .preview-box .file-info { font-size: 11px; color: #666; margin-top: 4px; }
  .btn-hapus-foto { background: #eb5757; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; margin-top: 6px; border: none; cursor: pointer; }
  .status { margin-top: 12px; font-size: 13px; text-align: center; min-height: 20px; }
  .success { color: #1f8f4f; font-weight: 600; }
  .error { color: #d64545; font-weight: 600; }
  .info { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<div class="card">
  <h2>📋 Absen Online</h2>
  <div class="sub">Data tersimpan otomatis di Google Sheets</div>
  <div id="status" class="status"></div>

  <div class="grid">
    <div class="row"><label>Nama</label><input type="text" id="nama" placeholder="Nama singkat" maxlength="40"></div>
    <div class="row"><label>Nama Gudang</label><input type="text" id="gudang" placeholder="Nama gudang" maxlength="40"></div>
    <div class="row"><label>Reguler / DW</label><select id="tipe"><option value="Reguler">Reguler</option><option value="DW">DW</option></select></div>
    <div class="row"><label>Masuk / Pulang</label><select id="statusAbsen"><option value="Masuk">Masuk</option><option value="Pulang">Pulang</option></select></div>
    <div class="row"><label>Tanggal</label><input type="date" id="tanggal"></div>
    <div class="row"><label>Lembur</label><select id="lembur"><option value="Tidak">Tidak</option><option value="Ya">Ya</option></select></div>
    <div class="row"><label>Jam Masuk</label><input type="time" id="jamMasuk"></div>
    <div class="row"><label>Jam Pulang</label><input type="time" id="jamPulang"></div>
  </div>

  <div class="row">
    <label>Foto (opsional)</label>
    <div class="foto-btns">
      <button type="button" class="btn-foto" onclick="document.getElementById('inputKamera').click()">
        <span class="ico">📷</span><span>Ambil Foto</span>
      </button>
      <button type="button" class="btn-foto" onclick="document.getElementById('inputGaleri').click()">
        <span class="ico">🖼️</span><span>Pilih dari Galeri</span>
      </button>
    </div>
    <input type="file" id="inputKamera" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="inputGaleri" accept="image/*" style="display:none">
    <div class="preview-box" id="previewBox"></div>
    <div class="info">Maks 10 MB. Foto otomatis dikompres sebelum dikirim.</div>
  </div>

  <button id="btnKirim" class="primary" onclick="kirimAbsen()">Simpan Absen</button>
</div>

<script>
// ⬇️⬇️⬇️ GANTI DENGAN URL /exec DARI APPS SCRIPT ⬇️⬇️⬇️
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwqns4W31SPeAKJMsIJRf_IjYj1ioufaHQ_6htRG7izWGNyVb2wKhFczslkzTZIICOLyg/exec';

let fotoFile = null;

document.getElementById('tanggal').value = new Date().toISOString().slice(0,10);

// ====== HANDLER FOTO ======
function handleFoto(file) {
  const box = document.getElementById('previewBox');
  if (!file) { fotoFile = null; box.innerHTML = ''; return; }
  if (file.size > 10 * 1024 * 1024) {
    alert('File terlalu besar (maks 10 MB)');
    fotoFile = null; box.innerHTML = ''; resetFileInputs(); return;
  }

  box.innerHTML = '<div style="padding:10px;color:#666">Memproses foto...</div>';

  compressImage(file, 800, 0.7).then(function(compressedFile) {
    fotoFile = compressedFile;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const kb = (compressedFile.size / 1024).toFixed(0);
      box.innerHTML =
        '<img src="' + ev.target.result + '">' +
        '<div class="file-info">' + compressedFile.name + ' (' + kb + ' KB setelah kompres)</div>' +
        '<button type="button" class="btn-hapus-foto" onclick="hapusFoto()">✕ Hapus Foto</button>';
    };
    reader.onerror = function(e) {
      if (e.target.error && e.target.error.name === 'NotReadableError') {
        alert('Foto tidak bisa dibaca. Coba download foto ke HP dulu, lalu pilih dari Galeri lokal (bukan Google Photos/Drive).');
      } else {
        alert('Gagal memuat foto. Coba pilih foto lain.');
      }
      fotoFile = null; box.innerHTML = ''; resetFileInputs();
    };
    reader.readAsDataURL(compressedFile);
  }).catch(function(err) {
    if (err && err.name === 'NotReadableError') {
      alert('Foto tidak bisa dibaca. Coba download foto ke HP dulu, lalu pilih dari Galeri lokal (bukan Google Photos/Drive).');
    } else {
      alert('Gagal memproses foto: ' + (err.message || 'tidak diketahui'));
    }
    fotoFile = null; box.innerHTML = ''; resetFileInputs();
  });
}

document.getElementById('inputKamera').addEventListener('change', function(e){
  handleFoto(e.target.files[0]);
});
document.getElementById('inputGaleri').addEventListener('change', function(e){
  handleFoto(e.target.files[0]);
});

function hapusFoto() {
  fotoFile = null;
  document.getElementById('previewBox').innerHTML = '';
  resetFileInputs();
}
function resetFileInputs() {
  document.getElementById('inputKamera').value = '';
  document.getElementById('inputGaleri').value = '';
}

// ====== KOMPRES FOTO ======
function compressImage(file, maxWidth, quality) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(function(blob) {
          if (!blob) { reject(new Error('Gagal mengompres gambar')); return; }
          const baseName = (file.name || 'foto').replace(/\.[^/.]+$/, '');
          const newFile = new File([blob], baseName + '_compressed.jpg', {
            type: 'image/jpeg',
            lastModified: Date.now()
          });
          resolve(newFile);
        }, 'image/jpeg', quality);
      };
      img.onerror = function() { reject(new Error('Gagal membaca gambar')); };
    };
    reader.onerror = function(e) {
      const err = e.target.error || new Error('Gagal membaca file');
      reject(err);
    };
  });
}

// ====== KIRIM ABSEN ======
async function kirimAbsen() {
  const btn = document.getElementById('btnKirim');
  const statusDiv = document.getElementById('status');
  const nama = document.getElementById('nama').value.trim();
  const gudang = document.getElementById('gudang').value.trim();
  if (!nama || !gudang) { alert('Nama dan Gudang wajib diisi!'); return; }

  btn.disabled = true;
  statusDiv.className = 'status';
  statusDiv.textContent = 'Memproses...';

  try {
    const payload = {
      tanggal: document.getElementById('tanggal').value,
      nama: nama,
      gudang: gudang,
      tipe: document.getElementById('tipe').value,
      status: document.getElementById('statusAbsen').value,
      jamMasuk: document.getElementById('jamMasuk').value,
      jamPulang: document.getElementById('jamPulang').value,
      lembur: document.getElementById('lembur').value,
      fotoBase64: null
    };

    if (fotoFile) {
      statusDiv.textContent = 'Membaca foto...';
      payload.fotoBase64 = await fileToBase64(fotoFile);
      payload.fotoName = 'foto_' + nama.replace(/\s+/g,'_') + '_' + Date.now() + '.jpg';
    }

    statusDiv.textContent = 'Mengirim...';

    const response = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow',
      credentials: 'omit'
    });

    const text = await response.text();
    let result;
    try { result = JSON.parse(text); }
    catch (e) { throw new Error('Server tidak kirim JSON. Cek deploy Web App = "Anyone".'); }

    if (result.status === 'success') {
      statusDiv.className = 'status success';
      statusDiv.textContent = '✅ Absen berhasil disimpan!';
      ['nama','gudang','jamMasuk','jamPulang'].forEach(function(id){
        document.getElementById(id).value = '';
      });
      hapusFoto();
    } else {
      throw new Error(result.message || 'Gagal menyimpan');
    }
  } catch (err) {
    statusDiv.className = 'status error';
    statusDiv.textContent = '❌ Gagal: ' + (err.message || err.toString() || 'Error tidak diketahui');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(e) {
      reject(e.target.error || new Error('Gagal baca file'));
    };
    r.readAsDataURL(file);
  });
}
</script>
</body>
</html>
